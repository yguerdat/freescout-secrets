name: Release

# Push a tag matching module.json (e.g. v1.1.5) to publish a release with
# Secrets.zip attached. FreeScout's "Update now" button downloads that asset
# (latestVersionZipUrl) and unzips it into Modules/, so the archive must hold
# a single top-level "Secrets/" folder.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches module.json
        run: |
          version=$(jq -r .version Secrets/module.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match module.json version $version"
            exit 1
          fi

      - name: Build Secrets.zip
        run: git archive --format=zip --prefix=Secrets/ -o Secrets.zip HEAD:Secrets

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Secrets.zip --title "$GITHUB_REF_NAME" --generate-notes
